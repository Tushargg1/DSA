name: DSA solution upsert

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub's minimum schedule interval
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-solved-problem-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRACKER_API_URL: ${{ vars.TRACKER_API_URL || 'https://dsa-estimators-1.onrender.com/api' }}
      TRACKER_EMAIL: ${{ secrets.TRACKER_EMAIL }}
      TRACKER_PASSWORD: ${{ secrets.TRACKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Export solved problems
        run: python scripts/sync_solutions.py

      - name: Commit changed solutions
        run: |
          git add -A -- .dsa-sync-index.json topics
          if git diff --cached --quiet; then
            echo "No new or updated solutions to commit."
            exit 0
          fi
          git config user.name "Tushar Goel"
          git config user.email "168968951+Tushargg1@users.noreply.github.com"
          git commit -m "Upsert DSA solutions by topic"
          git push

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSA Solution Capture</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>DSA Solution Capture</h1>
    <form id="settings-form">
      <label for="api-base-url">API base URL</label>
      <input id="api-base-url" name="apiBaseUrl" type="url" required
             placeholder="http://localhost:8080/api" autocomplete="url">

      <label for="extension-token">Extension token</label>
      <input id="extension-token" name="extensionToken" type="password" required
             placeholder="Paste your extension token" autocomplete="off">

      <button type="submit">Save settings</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
    <p class="privacy">Only accepted solution metadata and source are sent. Cookies and platform credentials are not collected.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
